services:
  - type: web
    name: georoad-inspector-api
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./georoad.db
      - key: UPLOAD_DIR
        value: /opt/render/project/data/uploads
      - key: MODEL_WEIGHTS_PATH
        value: ./models/road_damage_best.pt
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://georoad-inspector-ui.onrender.com,https://georoad-inspector.onrender.com
    disk:
      name: georoad-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    rootDir: backend

  - type: web
    name: georoad-inspector-ui
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /api/*
        destination: https://georoad-inspector-api.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://georoad-inspector-api.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
